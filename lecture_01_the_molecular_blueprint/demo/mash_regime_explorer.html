<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Mash Distance, ANI & Breakdown Regime Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-dark: #1f2228;
      --surface-dark: #2a2e37;
      --surface2-dark: #181a20;
      --border-dark: #3d4350;
      --text-dark: #e8ecf2;
      --muted-dark: #9aa3b2;
      --accent-dark: #64b5f6;
      --good-dark: #66bb6a;
      --warn-dark: #ffb74d;
      --bad-dark: #ef5350;
      --purple-dark: #ce93d8;

      --bg-light: #f6f8fb;
      --surface-light: #ffffff;
      --surface2-light: #eef2f7;
      --border-light: #d4dce6;
      --text-light: #1a202c;
      --muted-light: #5a6578;
      --accent-light: #1565c0;
      --good-light: #2e7d32;
      --warn-light: #e65100;
      --bad-light: #c62828;
      --purple-light: #7b1fa2;

      --bg: var(--bg-dark); --surface: var(--surface-dark); --surface2: var(--surface2-dark);
      --border: var(--border-dark); --text: var(--text-dark); --muted: var(--muted-dark);
      --accent: var(--accent-dark); --good: var(--good-dark); --warn: var(--warn-dark);
      --bad: var(--bad-dark); --purple: var(--purple-dark);
    }

    @media (prefers-color-scheme: light) {
      :root:not(.dark-theme) {
        --bg: var(--bg-light); --surface: var(--surface-light); --surface2: var(--surface2-light);
        --border: var(--border-light); --text: var(--text-light); --muted: var(--muted-light);
        --accent: var(--accent-light); --good: var(--good-light); --warn: var(--warn-light);
        --bad: var(--bad-light); --purple: var(--purple-light);
      }
    }
    :root.light-theme {
      color-scheme: light;
      --bg: var(--bg-light); --surface: var(--surface-light); --surface2: var(--surface2-light);
      --border: var(--border-light); --text: var(--text-light); --muted: var(--muted-light);
      --accent: var(--accent-light); --good: var(--good-light); --warn: var(--warn-light);
      --bad: var(--bad-light); --purple: var(--purple-light);
    }
    :root.dark-theme {
      color-scheme: dark;
      --bg: var(--bg-dark); --surface: var(--surface-dark); --surface2: var(--surface2-dark);
      --border: var(--border-dark); --text: var(--text-dark); --muted: var(--muted-dark);
      --accent: var(--accent-dark); --good: var(--good-dark); --warn: var(--warn-dark);
      --bad: var(--bad-dark); --purple: var(--purple-dark);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px 12px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.32;
      accent-color: var(--accent);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    @supports not (accent-color: auto) {
      input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; height: 18px; }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px; border-radius: 3px;
        background: linear-gradient(to right, var(--accent) var(--progress, 50%), var(--border) var(--progress, 50%));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent); margin-top: -4px; cursor: pointer;
      }
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
    }
    .ctrl { display: flex; flex-direction: column; gap: 3px; }
    .ctrl-head { display: flex; justify-content: space-between; font-size: 12px; }
    .ctrl-head label { color: var(--muted); font-weight: 600; }
    .ctrl-head output { font-family: ui-monospace, SFMono-Regular, monospace; font-weight: 700; color: var(--text); }
    .ctrl input[type="range"] { width: 100%; cursor: pointer; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.active { border-color: var(--accent); color: var(--accent); background: var(--surface2); }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    :root.dark-theme .btn.primary { color: #0c1726; }

    .regime-pill {
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
    }
    .regime-pill.good { background: rgba(76,175,80,0.18); color: var(--good); border-color: var(--good); }
    .regime-pill.warn { background: rgba(255,152,0,0.18); color: var(--warn); border-color: var(--warn); }
    .regime-pill.bad  { background: rgba(239,83,80,0.18); color: var(--bad); border-color: var(--bad); }

    .charts {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 10px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .card-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }
    svg.chart { width: 100%; height: auto; display: block; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 9px;
    }
    .stat .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; }
    .stat .v { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14.5px; font-weight: 700; margin-top: 2px; }
  </style>
</head>
<body>

<div class="controls">
  <div class="ctrl">
    <div class="ctrl-head"><label for="sl-d">True 1 − ANI (d)</label><output id="out-d">0.050</output></div>
    <input id="sl-d" type="range" min="0" max="0.28" step="0.005" value="0.05">
  </div>
  <div class="ctrl">
    <div class="ctrl-head"><label for="sl-k">k-mer length (k)</label><output id="out-k">21</output></div>
    <input id="sl-k" type="range" min="9" max="31" step="1" value="21">
  </div>
  <div class="ctrl">
    <div class="ctrl-head"><label for="sl-s">Sketch size (s)</label><output id="out-s">1000</output></div>
    <input id="sl-s" type="range" min="100" max="5000" step="100" value="1000">
  </div>
  <div class="ctrl">
    <div class="ctrl-head"><label for="sl-rho">Size ratio |A| / |B|</label><output id="out-rho">1.00</output></div>
    <input id="sl-rho" type="range" min="0.10" max="1.00" step="0.02" value="1.00">
  </div>
</div>

<div class="toolbar">
  <div class="btn-group">
    <span style="font-size:12px;color:var(--muted);font-weight:600">Genome G:</span>
    <button type="button" class="btn" data-g="10000">Virus (10 kb)</button>
    <button type="button" class="btn active" data-g="5000000">Bacteria (5 Mb)</button>
    <button type="button" class="btn" data-g="3000000000">Human (3 Gb)</button>
    <button type="button" class="btn primary" id="btn-mc">🎲 Resample Sketch</button>
  </div>
  <span id="regime-pill" class="regime-pill good">Valid Species Regime</span>
</div>

<div class="charts">
  <div class="card">
    <div class="card-title">Mash Distance D vs. True 1 − ANI (with 95% CI &amp; Live Sample)</div>
    <svg id="svg-d" class="chart" viewBox="0 0 430 230" role="img" aria-label="Mash distance versus true divergence curve"></svg>
  </div>
  <div class="card">
    <div class="card-title">Statistical Power Across k: −log₁₀(p-value) vs. k</div>
    <svg id="svg-p" class="chart" viewBox="0 0 410 230" role="img" aria-label="Negative log10 p-value across k-mer lengths"></svg>
  </div>
</div>

<div class="stats-row">
  <div class="stat"><div class="k">True ANI</div><div class="v" id="st-ani">—</div></div>
  <div class="stat"><div class="k">Sampled Hashes x/s</div><div class="v" id="st-hits">—</div></div>
  <div class="stat"><div class="k">Mash D (Sampled)</div><div class="v" id="st-d">—</div></div>
  <div class="stat"><div class="k">Size Bias (D − d)</div><div class="v" id="st-bias">—</div></div>
  <div class="stat"><div class="k">Null p-value</div><div class="v" id="st-pval">—</div></div>
</div>

<script>
(() => {
  // ---- Theme Sync ----
  function applyTheme(theme) {
    const r = document.documentElement;
    r.classList.toggle('light-theme', theme === 'light');
    r.classList.toggle('dark-theme', theme === 'dark');
    r.style.colorScheme = theme;
    render();
  }
  window.addEventListener('message', e => { if (e.data && e.data.type === 'theme-change') applyTheme(e.data.theme); });
  try { window.parent.postMessage({ type: 'get-theme' }, '*'); } catch (_) {}

  if (!CSS.supports('accent-color', 'auto')) {
    document.querySelectorAll('input[type="range"]').forEach(sl => {
      const upd = () => sl.style.setProperty('--progress', `${((sl.value - sl.min) / (sl.max - sl.min)) * 100}%`);
      upd(); sl.addEventListener('input', upd);
    });
  }

  // ---- Exact Math: Lanczos log-gamma + Binomial right-tail P(X >= x) ----
  function logGamma(z) {
    const g = 7;
    const p = [
      0.99999999999980993, 676.5203681218851, -1259.1392167224028,
      771.32342877765313, -176.61502916214059, 12.507343278686905,
      -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7
    ];
    if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - logGamma(1 - z);
    z -= 1;
    let x = p[0];
    for (let i = 1; i < g + 2; i++) x += p[i] / (z + i);
    const t = z + g + 0.5;
    return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
  }

  function logBinomPMF(i, s, r) {
    if (r <= 0) return i === 0 ? 0 : -Infinity;
    if (r >= 1) return i === s ? 0 : -Infinity;
    return logGamma(s + 1) - logGamma(i + 1) - logGamma(s - i + 1) + i * Math.log(r) + (s - i) * Math.log(1 - r);
  }

  // Returns { log10p, pStr } for P(Binom(s, r) >= x) without underflow!
  function binomRightTailLog10(x, s, r) {
    if (x <= 0) return 0;
    if (x > s) return -999;
    if (r <= 0) return -999;
    if (r >= 1) return 0;
    if (x <= s * r) {
      // Lower half: sum left tail 0..x-1 and subtract from 1
      let maxL = -Infinity;
      const terms = [];
      for (let i = 0; i < x; i++) {
        const lp = logBinomPMF(i, s, r);
        terms.push(lp);
        if (lp > maxL) maxL = lp;
      }
      let sum = 0;
      for (const lp of terms) sum += Math.exp(lp - maxL);
      const pLeft = Math.min(1, Math.exp(maxL) * sum);
      const pRight = Math.max(1e-300, 1 - pLeft);
      return Math.log10(pRight);
    }
    // Right tail strictly decreasing from i = x upward
    const lp0 = logBinomPMF(x, s, r);
    let sum = 1.0, cur = lp0;
    for (let i = x + 1; i <= s; i++) {
      cur = logBinomPMF(i, s, r);
      const ratio = Math.exp(cur - lp0);
      sum += ratio;
      if (ratio < 1e-12) break;
    }
    const logP = lp0 + Math.log(sum);
    return Math.min(0, logP / Math.LN10);
  }

  function formatPval(log10p) {
    if (log10p >= -0.001) return '1.00';
    if (log10p > -3) return Math.pow(10, log10p).toFixed(3);
    const exp = Math.floor(log10p);
    const mant = Math.pow(10, log10p - exp);
    return `${mant.toFixed(1)}×10^${exp}`;
  }

  // Exact Jaccard under mutation rate d and size ratio rho = |A|/|B| <= 1
  function expectedJ(d, k, rho) {
    const p = Math.exp(-k * d);
    return (p * rho) / (1 + rho * (1 - p));
  }
  function mashFromJ(J, k) {
    if (J <= 0) return Infinity;
    return Math.max(0, -(1 / k) * Math.log((2 * J) / (1 + J)));
  }
  function nullRandomJ(G, rho, k) {
    const space = Math.pow(4, k);
    const r1 = -Math.expm1(-(G * rho) / space);
    const r2 = -Math.expm1(-G / space);
    const denom = r1 + r2 - r1 * r2;
    return denom > 0 ? (r1 * r2) / denom : 0;
  }

  // Binomial RNG (exact for small s*J, Box-Muller normal approx for large s*J)
  function sampleBinom(s, p) {
    if (p <= 0) return 0;
    if (p >= 1) return s;
    const mean = s * p;
    if (s <= 2000) {
      let c = 0;
      for (let i = 0; i < s; i++) if (Math.random() < p) c++;
      return c;
    }
    const sd = Math.sqrt(s * p * (1 - p));
    const u1 = Math.max(1e-12, Math.random()), u2 = Math.random();
    const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    return Math.max(0, Math.min(s, Math.round(mean + sd * z)));
  }

  const slD = document.getElementById('sl-d');
  const slK = document.getElementById('sl-k');
  const slS = document.getElementById('sl-s');
  const slRho = document.getElementById('sl-rho');
  let genomeG = 5000000;
  let mcHits = null;

  function getCSS(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function resample() {
    const d = +slD.value, k = +slK.value, s = +slS.value, rho = +slRho.value;
    const jTot = Math.min(1, expectedJ(d, k, rho) + nullRandomJ(genomeG, rho, k) * (1 - expectedJ(d, k, rho)));
    mcHits = sampleBinom(s, jTot);
    render();
  }

  function render() {
    const d = +slD.value, k = +slK.value, s = +slS.value, rho = +slRho.value;
    document.getElementById('out-d').textContent = d.toFixed(3);
    document.getElementById('out-k').textContent = k;
    document.getElementById('out-s').textContent = s;
    document.getElementById('out-rho').textContent = rho.toFixed(2);

    const jExp = expectedJ(d, k, rho);
    const rNull = nullRandomJ(genomeG, rho, k);
    const jObsMean = Math.min(1, jExp + rNull * (1 - jExp));
    const xUse = mcHits !== null ? mcHits : Math.round(s * jObsMean);
    const jHat = xUse / s;
    const dHat = mashFromJ(jHat, k);
    const dExpected = mashFromJ(jObsMean, k);
    const log10p = binomRightTailLog10(xUse, s, rNull);

    const cAcc = getCSS('--accent'), cGood = getCSS('--good'), cWarn = getCSS('--warn');
    const cBad = getCSS('--bad'), cMut = getCSS('--muted'), cBord = getCSS('--border'), cPurp = getCSS('--purple');

    // ---- Regime badge ----
    const pill = document.getElementById('regime-pill');
    if (rNull > 0.05) {
      pill.className = 'regime-pill bad';
      pill.textContent = `⚠ Collision Noise! (r = ${(rNull * 100).toFixed(1)}% at k=${k})`;
    } else if (d > 0.20 || s * jExp < 5) {
      pill.className = 'regime-pill bad';
      pill.textContent = '⚠ High-Divergence Breakdown (k-mer wipeout)';
    } else if (rho < 0.75) {
      pill.className = 'regime-pill warn';
      pill.textContent = `⚠ Unequal-Size Bias (+${(dExpected - d).toFixed(3)} inflation)`;
    } else if (d <= 0.05) {
      pill.className = 'regime-pill good';
      pill.textContent = '✓ Same-Species Regime (ANI ≥ 95%)';
    } else {
      pill.className = 'regime-pill good';
      pill.textContent = '✓ Valid Linear Mash Regime';
    }

    // ---- Left Chart: Mash D vs True d ----
    const svgD = document.getElementById('svg-d');
    const pL = 44, pR = 14, pT = 14, pB = 34;
    const cw = 430 - pL - pR, ch = 230 - pT - pB;
    const xD = v => pL + (v / 0.30) * cw;
    const yD = v => pT + ch * (1 - Math.min(0.35, v) / 0.35);

    let sd = '';
    // Shaded zones
    sd += `<rect x="${xD(0)}" y="${pT}" width="${xD(0.05) - xD(0)}" height="${ch}" fill="${cGood}" opacity="0.10"/>`;
    sd += `<rect x="${xD(0.20)}" y="${pT}" width="${xD(0.30) - xD(0.20)}" height="${ch}" fill="${cBad}" opacity="0.11"/>`;
    for (const v of [0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30]) {
      const x = xD(v);
      sd += `<line x1="${x}" y1="${pT}" x2="${x}" y2="${pT + ch}" stroke="${cBord}" stroke-dasharray="3,3"/>`;
      sd += `<text x="${x}" y="${230 - 15}" text-anchor="middle" fill="${cMut}" font-size="10">${v.toFixed(2)}</text>`;
    }
    for (const v of [0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35]) {
      const y = yD(v);
      sd += `<line x1="${pL}" y1="${y}" x2="${pL + cw}" y2="${y}" stroke="${cBord}" stroke-dasharray="3,3"/>`;
      if (Math.round(v * 100) % 10 === 0 || v === 0.05)
        sd += `<text x="${pL - 6}" y="${y + 3.5}" text-anchor="end" fill="${cMut}" font-size="10">${v.toFixed(2)}</text>`;
    }
    // Ideal diagonal D = d
    sd += `<line x1="${xD(0)}" y1="${yD(0)}" x2="${xD(0.30)}" y2="${yD(0.30)}" stroke="${cMut}" stroke-dasharray="5,4" stroke-width="1.4"/>`;

    // 95% CI polygon + expected curve for current (k, s, rho)
    const upper = [], lower = [], mid = [];
    for (let i = 0; i <= 75; i++) {
      const di = (i / 75) * 0.295;
      const je = expectedJ(di, k, rho);
      const jm = Math.min(1, je + rNull * (1 - je));
      const se = Math.sqrt(jm * (1 - jm) / s);
      const jLo = jm - 1.96 * se;
      const jHi = Math.min(0.9999, jm + 1.96 * se);
      const dm = mashFromJ(jm, k);
      if (dm <= 0.35) mid.push(`${xD(di).toFixed(1)},${yD(dm).toFixed(1)}`);
      if (jLo > 1e-4) {
        const dHi = Math.min(0.35, mashFromJ(jLo, k));
        const dLo = Math.min(0.35, mashFromJ(jHi, k));
        upper.push(`${xD(di).toFixed(1)},${yD(dHi).toFixed(1)}`);
        lower.unshift(`${xD(di).toFixed(1)},${yD(dLo).toFixed(1)}`);
      }
    }
    if (upper.length > 2) {
      sd += `<polygon points="${upper.concat(lower).join(' ')}" fill="${cAcc}" opacity="0.22"/>`;
    }
    if (mid.length > 1) {
      sd += `<polyline points="${mid.join(' ')}" fill="none" stroke="${cAcc}" stroke-width="2.4"/>`;
    }
    // Current expected dot + sampled dot
    if (isFinite(dExpected) && dExpected <= 0.35) {
      sd += `<circle cx="${xD(d)}" cy="${yD(dExpected)}" r="4.5" fill="${cAcc}" stroke="#fff" stroke-width="1.3"/>`;
    }
    if (isFinite(dHat) && dHat <= 0.35) {
      sd += `<circle cx="${xD(d)}" cy="${yD(dHat)}" r="5.5" fill="none" stroke="${cWarn}" stroke-width="2.2"/>`;
    }
    sd += `<text x="${pL + cw / 2}" y="${230 - 2}" text-anchor="middle" fill="${cMut}" font-size="10.5">True Divergence d = 1 − ANI</text>`;
    sd += `<text x="12" y="${pT + ch / 2}" text-anchor="middle" fill="${cMut}" font-size="10.5" transform="rotate(-90 12 ${pT + ch / 2})">Estimated Mash D</text>`;
    svgD.innerHTML = sd;

    // ---- Right Chart: -log10(p-value) across k = 9..31 ----
    const svgP = document.getElementById('svg-p');
    const qL = 44, qR = 14, qT = 14, qB = 34;
    const qw = 410 - qL - qR, qh = 230 - qT - qB;
    const xK = kv => qL + ((kv - 9) / 22) * qw;
    const yP = nl => qT + qh * (1 - Math.min(60, Math.max(0, nl)) / 60);

    let sp = '';
    // Noise danger strip below -log10(p) = 5
    sp += `<rect x="${qL}" y="${yP(5)}" width="${qw}" height="${yP(0) - yP(5)}" fill="${cBad}" opacity="0.14"/>`;
    for (const v of [0, 10, 20, 30, 40, 50, 60]) {
      const y = yP(v);
      sp += `<line x1="${qL}" y1="${y}" x2="${qL + qw}" y2="${y}" stroke="${cBord}" stroke-dasharray="3,3"/>`;
      sp += `<text x="${qL - 6}" y="${y + 3.5}" text-anchor="end" fill="${cMut}" font-size="10">${v}</text>`;
    }
    sp += `<line x1="${qL}" y1="${yP(5)}" x2="${qL + qw}" y2="${yP(5)}" stroke="${cBad}" stroke-dasharray="5,3" stroke-width="1.4"/>`;
    sp += `<text x="${qL + qw - 4}" y="${yP(5) - 4}" text-anchor="end" fill="${cBad}" font-size="9.5" font-weight="700">p = 10⁻⁵ cutoff</text>`;

    const kPts = [];
    let curNL = 0;
    for (let kv = 9; kv <= 31; kv++) {
      const jv = expectedJ(d, kv, rho);
      const rv = nullRandomJ(genomeG, rho, kv);
      const xv = Math.round(s * Math.min(1, jv + rv * (1 - jv)));
      const nl = Math.min(60, -binomRightTailLog10(xv, s, rv));
      kPts.push(`${xK(kv).toFixed(1)},${yP(nl).toFixed(1)}`);
      if (kv === k) curNL = nl;
    }
    sp += `<polyline points="${kPts.join(' ')}" fill="none" stroke="${cPurp}" stroke-width="2.5"/>`;
    sp += `<line x1="${xK(k)}" y1="${qT}" x2="${xK(k)}" y2="${qT + qh}" stroke="${cAcc}" stroke-dasharray="3,3" stroke-width="1.3"/>`;
    sp += `<circle cx="${xK(k)}" cy="${yP(curNL)}" r="5.5" fill="${curNL >= 5 ? cGood : cBad}" stroke="#fff" stroke-width="1.4"/>`;

    for (const tk of [9, 13, 17, 21, 25, 29]) {
      sp += `<text x="${xK(tk)}" y="${230 - 15}" text-anchor="middle" fill="${cMut}" font-size="10">${tk}</text>`;
    }
    sp += `<text x="${qL + qw / 2}" y="${230 - 2}" text-anchor="middle" fill="${cMut}" font-size="10.5">k-mer Length (k)</text>`;
    sp += `<text x="12" y="${qT + qh / 2}" text-anchor="middle" fill="${cMut}" font-size="10.5" transform="rotate(-90 12 ${qT + qh / 2})">−log₁₀(p-value) (capped 60)</text>`;
    svgP.innerHTML = sp;

    // ---- Stats Strip ----
    document.getElementById('st-ani').textContent = `${((1 - d) * 100).toFixed(1)}%`;
    document.getElementById('st-hits').textContent = `${xUse} / ${s}`;
    document.getElementById('st-d').innerHTML = isFinite(dHat)
      ? `<span style="color:${dHat <= 0.05 ? 'var(--good)' : dHat > 0.2 ? 'var(--bad)' : 'var(--accent)'}">${dHat.toFixed(4)}</span>`
      : `<span style="color:var(--bad)">∞ (0 hits)</span>`;
    const bias = isFinite(dExpected) ? dExpected - d : Infinity;
    document.getElementById('st-bias').innerHTML = isFinite(bias)
      ? `<span style="color:${Math.abs(bias) > 0.01 ? 'var(--warn)' : 'var(--good)'}">${bias >= 0 ? '+' : ''}${bias.toFixed(4)}</span>`
      : '—';
    document.getElementById('st-pval').innerHTML =
      `<span style="color:${log10p <= -5 ? 'var(--good)' : 'var(--bad)'}">${formatPval(log10p)}</span>`;
  }

  [slD, slK, slS, slRho].forEach(el => el.addEventListener('input', () => { mcHits = null; render(); }));
  document.querySelectorAll('[data-g]').forEach(btn => {
    btn.addEventListener('click', () => {
      genomeG = +btn.dataset.g;
      mcHits = null;
      document.querySelectorAll('[data-g]').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });
  document.getElementById('btn-mc').addEventListener('click', resample);
  render();
})();
</script>
</body>
</html>
